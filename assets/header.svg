<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0a1429" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .terminal-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #4ade80; }
      .title { font-family: 'Courier New', monospace; font-size: 46px; font-weight: 900; fill: #00ffcc; filter: url(#glow); letter-spacing: 2px;}
      .subtitle { font-family: 'Courier New', monospace; font-size: 17px; fill: #94a3b8; letter-spacing: 2px; font-weight: bold;}
      .path { fill: #64748b; }
      .bracket { fill: #3b82f6; }
      
      /* හැමවිටම Auto-run වීම සඳහා infinite loops එකතු කරන ලදී */
      .anim-fade-1 { animation: fadeInOut 4s ease-in-out infinite; }
      .anim-fade-2 { animation: fadeInOut 4s ease-in-out 0.5s infinite; }
      .anim-fade-3 { animation: fadeInOut 4s ease-in-out 1s infinite; }
      .cursor { animation: blink 1s step-end infinite; }

      @keyframes fadeInOut {
        0% { opacity: 0; transform: translateY(10px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Arka Plan -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="8" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="4" rx="8" />

  <!-- Mac Terminal Üst Çubuğu -->
  <circle cx="25" cy="25" r="7" fill="#ef4444" />
  <circle cx="45" cy="25" r="7" fill="#eab308" />
  <circle cx="65" cy="25" r="7" fill="#22c55e" />
  
  <text x="95" y="29" class="terminal-text path">dulana@macbook-air-m1: ~/portfolio<tspan class="cursor" fill="#4ade80"> █</tspan></text>
  <text x="700" y="29" class="terminal-text path">SSH: PORT 22</text>

  <!-- Ana Neon Yazı -->
  <g class="anim-fade-1">
    <text x="400" y="115" class="title" text-anchor="middle">DULANA CHATHURMA</text>
  </g>
  
  <!-- Alt Başlıklar -->
  <g class="anim-fade-2">
    <text x="400" y="155" class="subtitle" text-anchor="middle">
      <tspan class="bracket">[ </tspan>SOFTWARE ENGINEER <tspan fill="#cbd5e1">·</tspan> AI/ML EXPLORER <tspan fill="#cbd5e1">·</tspan> UI/UX ARCHITECT<tspan class="bracket"> ]</tspan>
    </text>
    <text x="400" y="185" class="terminal-text path" text-anchor="middle">BSc (Hons) Software Engineering @ University of Kelaniya</text>
  </g>

  <!-- Alt Terminal Durum Çubuğu -->
  <g class="anim-fade-3">
    <text x="30" y="230" class="terminal-text">SYS_TELEMETRY: <tspan fill="#22c55e">ONLINE</tspan></text>
    <text x="250" y="230" class="terminal-text">TARGET_SEEKING: <tspan fill="#00ffcc">2027_INTERNSHIPS</tspan></text>
    <text x="530" y="230" class="terminal-text">ENVIRONMENT: <tspan fill="#a855f7">PRODUCTION_READY</tspan></text>
  </g>
</svg>
