  <path d="M 842 22 L 842 8 L 828 8" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.9" />
  <path d="M 8 193 L 8 207 L 22 207" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.9" />
  <path d="M 842 193 L 842 207 L 828 207" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.9" />

