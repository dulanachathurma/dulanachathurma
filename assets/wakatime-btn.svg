<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <defs>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0a1429" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .btn-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ffcc; font-weight: bold; letter-spacing: 1px; filter: url(#glow); }
      .btn-sub { font-family: 'Courier New', monospace; font-size: 11px; fill: #4ade80; }
      .button-box { stroke: #38bdf8; stroke-width: 2; rx: 8; fill: url(#btn-bg); transition: 0.3s; }
      
      /* සම්පූර්ණ ටෙක්ස්ට් සහ ඇරෝස් සඳහා ස්වයංක්‍රීයව දිලිසෙන (Auto-run) සහ ඉස්මතු වන ඇනිමේෂන් එක */
      .anim-text-pulse { animation: textGlow 2s ease-in-out infinite; }
      .anim-arrow-move { animation: moveArrow 1s ease-in-out infinite; display: inline-block; }
      
      .button-group:hover .button-box { stroke: #00ffcc; stroke-width: 3; filter: drop-shadow(0 0 12px #00ffcc); }
      .button-group:hover .anim-text-pulse { fill: #ffffff; filter: drop-shadow(0 0 8px #00ffcc); }

      @keyframes textGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00ffcc); }
      }
      
      @keyframes moveArrow {
        0%, 100% { transform: translateX(0); opacity: 0.4; }
        50% { transform: translateX(6px); opacity: 1; color: #00ffcc; }
      }
    </style>
  </defs>

  <g class="button-group" cursor="pointer">
    <!-- Button Background -->
    <rect x="2" y="2" width="396" height="56" class="button-box" />
    
    <!-- Icon -->
    <text x="25" y="37" font-size="20">📊</text>

    <!-- Animated Main & Sub Text Group -->
    <g class="anim-text-pulse">
      <!-- Main Label -->
      <text x="65" y="28" class="btn-text">VIEW WAKATIME CODING STATS</text>
      
      <!-- Sub Label with Moving Arrows -->
      <text x="65" y="44" class="btn-sub">Click to check live activity <tspan class="anim-arrow-move" fill="#00ffcc">&gt;&gt;</tspan></text>
    </g>
  </g>
</svg>
