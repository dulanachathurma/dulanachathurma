<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <defs>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0a1429" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .btn-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ffcc; font-weight: bold; letter-spacing: 1px; filter: url(#glow); }
      .btn-sub { font-family: 'Courier New', monospace; font-size: 11px; fill: #4ade80; }
      .button-box { stroke: #38bdf8; stroke-width: 2; rx: 8; fill: url(#btn-bg); transition: 0.3s; }
      .button-group:hover .button-box { stroke: #00ffcc; stroke-width: 3; filter: drop-shadow(0 0 8px #00ffcc); }
    </style>
  </defs>

  <g class="button-group" cursor="pointer">
    <!-- Button Background -->
    <rect x="2" y="2" width="396" height="56" class="button-box" />
    
    <!-- Icon / Symbol -->
    <text x="25" y="36" font-size="20">📊</text>

    <!-- Main Label -->
    <text x="65" y="28" class="btn-text">VIEW WAKATIME CODING STATS</text>
    
    <!-- Sub Label -->
    <text x="65" y="44" class="btn-sub">Click to check live activity &gt;&gt;</text>
  </g>
</svg>
